<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">✓</div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Log in to your DoItLater account</p>
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit($event)" novalidate autocomplete="on">
      <div class="form-group">
        <label for="login-identifier">Username or email</label>
        <input
          type="text"
          id="login-identifier"
          name="identifier"
          placeholder="you@example.com"
          autocomplete="username"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          required
          maxlength="255"
          [(ngModel)]="identifier"
        />
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <div class="password-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="login-password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            required
            minlength="8"
            maxlength="128"
            [(ngModel)]="password"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            <span class="eye-icon">{{ showPassword ? '🙈' : '👁' }}</span>
          </button>
        </div>
      </div>

      <div class="form-row">
        <label class="checkbox-label">
          <input type="checkbox" name="remember" [(ngModel)]="remember" />
          <span>Remember me</span>
        </label>
        <a href="#" class="link-muted" rel="noopener">Forgot password?</a>
      </div>

      <button type="submit" class="btn-primary btn-block" [disabled]="submitting()">
        {{ submitting() ? 'Please wait…' : 'Log In' }}
      </button>

      <p *ngIf="errorMessage()" class="form-error" role="alert">{{ errorMessage() }}</p>
    </form>

    <p class="auth-footer">
      Don't have an account?
      <a routerLink="/signup" class="link-accent" rel="noopener">Sign up</a>
    </p>

    <p class="auth-footer-small">
      <a routerLink="/habits" class="link-muted" rel="noopener">← Back to Habit Tracker</a>
    </p>
  </div>
</div>
