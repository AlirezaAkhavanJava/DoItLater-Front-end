<!DOCTYPE html>
<html lang="en" data-theme="light" data-font="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <div class="brand-icon">✓</div>
            <div>
                <h1>Habit Tracker</h1>
                <p>Build better days, one check at a time</p>
            </div>
        </div>
        <div class="controls">
            <div class="toggle-group" role="group" aria-label="Font">
                <button class="toggle-btn" data-font-set="system" title="System font">Aa</button>
                <button class="toggle-btn" data-font-set="mono" title="Monospace">&lt;/&gt;</button>
                <button class="toggle-btn" data-font-set="victorian" title="Victorian cursive">✒</button>
            </div>
            <button class="icon-button" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">☾</button>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <div>
                <p class="eyebrow">Today</p>
                <h2 id="heroTitle">Good morning.</h2>
                <p class="hero-text" id="heroSubtitle">Here's how your habits are going.</p>
            </div>
            <div class="date-box" id="todayDate">—</div>
        </section>

        <section class="summary-grid">
            <div class="summary-card">
                <span class="summary-label">Total Habits</span>
                <strong id="statTotal">0</strong>
            </div>
            <div class="summary-card">
                <span class="summary-label">Done Today</span>
                <strong id="statDone">0</strong>
            </div>
            <div class="summary-card">
                <span class="summary-label">Best Streak</span>
                <strong id="statStreak">0</strong>
            </div>
        </section>

        <section class="content-grid">
            <aside class="panel form-panel">
                <div class="panel-heading">
                    <h3>New Habit</h3>
                </div>
                <form id="habitForm" novalidate>
                    <label for="habitName">Habit name</label>
                    <input type="text" id="habitName" placeholder="e.g. Read 10 pages" maxlength="60" required>

                    <label for="habitGoal">Goal</label>
                    <input type="text" id="habitGoal" placeholder="e.g. Every day" maxlength="40">

                    <label for="habitCategory">Category</label>
                    <select id="habitCategory">
                        <option value="health">Health</option>
                        <option value="mind">Mind</option>
                        <option value="work">Work</option>
                        <option value="social">Social</option>
                        <option value="other">Other</option>
                    </select>

                    <div class="form-actions">
                        <button type="submit" class="primary-button">Add Habit</button>
                        <button type="reset" class="secondary-button">Clear</button>
                    </div>
                    <p class="form-message" id="formMessage"></p>
                </form>
            </aside>

            <section class="panel tasks-panel">
                <div class="tasks-heading">
                    <h3>Your Habits</h3>
                    <select class="filter-select" id="filterSelect">
                        <option value="all">All</option>
                        <option value="today">Today</option>
                        <option value="done">Done</option>
                        <option value="pending">Pending</option>
                    </select>
                </div>
                <div class="tasks-list" id="habitsList"></div>
            </section>
        </section>
    </main>

    <div class="toast" id="toast"></div>

    <script>
        // ---------- State ----------
        const STORAGE_KEY = 'habit-tracker-v1';
        let habits = load();
        let filter = 'all';

        // ---------- Elements ----------
        const form = document.getElementById('habitForm');
        const nameInput = document.getElementById('habitName');
        const goalInput = document.getElementById('habitGoal');
        const categoryInput = document.getElementById('habitCategory');
        const list = document.getElementById('habitsList');
        const filterSelect = document.getElementById('filterSelect');
        const formMessage = document.getElementById('formMessage');
        const toastEl = document.getElementById('toast');

        // ---------- Init ----------
        document.getElementById('todayDate').textContent =
            new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });

        // Greeting
        const hour = new Date().getHours();
        const heroTitle = document.getElementById('heroTitle');
        if (hour < 12) heroTitle.textContent = 'Good morning.';
        else if (hour < 18) heroTitle.textContent = 'Good afternoon.';
        else heroTitle.textContent = 'Good evening.';

        // ---------- Storage ----------
        function load() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            } catch {
                return [];
            }
        }
        function save() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
        }

        // ---------- Helpers ----------
        const todayKey = () => new Date().toISOString().slice(0, 10);

        function toast(msg, isError = false) {
            toastEl.textContent = msg;
            toastEl.classList.toggle('error', isError);
            toastEl.classList.add('show');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => toastEl.classList.remove('show'), 2400);
        }

        function updateStreak(habit) {
            const days = habit.days || [];
            if (!days.length) return 0;
            const sorted = [...days].sort().reverse();
            let streak = 0;
            let cursor = new Date();
            // If not done today, start from yesterday
            if (sorted[0] !== todayKey()) {
                cursor.setDate(cursor.getDate() - 1);
            }
            while (true) {
                const key = cursor.toISOString().slice(0, 10);
                if (days.includes(key)) {
                    streak++;
                    cursor.setDate(cursor.getDate() - 1);
                } else break;
            }
            return streak;
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // ---------- Render ----------
        function render() {
            const today = todayKey();

            // Stats
            document.getElementById('statTotal').textContent = habits.length;
            document.getElementById('statDone').textContent =
                habits.filter(h => (h.days || []).includes(today)).length;
            const best = habits.reduce((max, h) => Math.max(max, updateStreak(h)), 0);
            document.getElementById('statStreak').textContent = best;

            // List
            let visible = habits;
            if (filter === 'today') visible = habits.filter(h => h.days?.includes(today));
            if (filter === 'done') visible = habits.filter(h => h.days?.includes(today));
            if (filter === 'pending') visible = habits.filter(h => !h.days?.includes(today));

            if (!visible.length) {
                list.innerHTML = `<div class="empty-state">No habits to show. Add one to get started!</div>`;
                return;
            }

            list.innerHTML = visible.map(h => {
                const done = (h.days || []).includes(today);
                const streak = updateStreak(h);
                return `
                    <article class="task-card ${done ? 'completed' : ''}" data-id="${h.id}">
                        <button class="task-check ${done ? 'checked' : ''}" data-action="toggle" aria-label="Toggle habit">
                            ${done ? '✓' : ''}
                        </button>
                        <div class="task-main">
                            <h4 class="task-title">${escapeHtml(h.name)}</h4>
                            ${h.goal ? `<p class="task-description">${escapeHtml(h.goal)}</p>` : ''}
                            <div class="task-meta">
                                <span class="badge badge-${h.category}">${h.category}</span>
                                <span class="due-date">🔥 ${streak} day${streak === 1 ? '' : 's'} streak</span>
                            </div>
                        </div>
                        <div class="task-actions">
                            <button class="task-action delete" data-action="delete">Delete</button>
                        </div>
                    </article>
                `;
            }).join('');
        }

        // ---------- Events ----------
        form.addEventListener('submit', e => {
            e.preventDefault();
            const name = nameInput.value.trim();
            if (!name) {
                formMessage.textContent = 'Please enter a habit name.';
                return;
            }
            formMessage.textContent = '';
            habits.push({
                id: crypto.randomUUID(),
                name,
                goal: goalInput.value.trim(),
                category: categoryInput.value,
                days: [],
                createdAt: Date.now()
            });
            save();
            render();
            form.reset();
            toast('Habit added!');
        });

        list.addEventListener('click', e => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const card = btn.closest('.task-card');
            const id = card.dataset.id;
            const habit = habits.find(h => h.id === id);
            if (!habit) return;

            if (btn.dataset.action === 'toggle') {
                const today = todayKey();
                habit.days = habit.days || [];
                if (habit.days.includes(today)) {
                    habit.days = habit.days.filter(d => d !== today);
                    toast('Marked as pending');
                } else {
                    habit.days.push(today);
                    toast('Nice work! Streak updated 🔥');
                }
                save();
                render();
            }

            if (btn.dataset.action === 'delete') {
                habits = habits.filter(h => h.id !== id);
                save();
                render();
                toast('Habit removed');
            }
        });

        filterSelect.addEventListener('change', () => {
            filter = filterSelect.value;
            render();
        });

        // ---------- Theme + Font toggles ----------
        const html = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');

        // Load saved prefs
        html.dataset.theme = localStorage.getItem('ht-theme') || 'light';
        html.dataset.font = localStorage.getItem('ht-font') || 'system';
        syncThemeIcon();
        syncFontButtons();

        themeToggle.addEventListener('click', () => {
            html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('ht-theme', html.dataset.theme);
            syncThemeIcon();
        });

        document.querySelectorAll('[data-font-set]').forEach(btn => {
            btn.addEventListener('click', () => {
                html.dataset.font = btn.dataset.fontSet;
                localStorage.setItem('ht-font', html.dataset.font);
                syncFontButtons();
            });
        });

        function syncThemeIcon() {
            themeToggle.textContent = html.dataset.theme === 'dark' ? '☀' : '☾';
        }
        function syncFontButtons() {
            document.querySelectorAll('[data-font-set]').forEach(b => {
                b.classList.toggle('active', b.dataset.fontSet === html.dataset.font);
            });
        }

        // ---------- Start ----------
        render();
    </script>
</body>
</html>
