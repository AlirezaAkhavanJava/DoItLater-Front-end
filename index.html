<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DoItLater — Track habits, finish tasks, get things done." />
  <meta name="theme-color" content="#121212" />
  <title>DoItLater</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <!-- Apply the saved theme BEFORE React mounts so there is no flash -->
  <script>
    (function () {
      try {
        var allowed = ['90s', 'hana', 'abyss'];
        var saved = localStorage.getItem('doitlater.theme');
        document.documentElement.setAttribute(
          'data-theme',
          allowed.indexOf(saved) !== -1 ? saved : '90s'
        );
      } catch (e) {
        document.documentElement.setAttribute('data-theme', '90s');
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
