<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Details</title>
    <link rel="stylesheet" href="tcr.css">
    <link rel="stylesheet" href="habit-detail.css">
    <link rel="stylesheet" href="/themes.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/themes.js" data-default-theme="hana"></script>
</head>

<body>

    <div class="app-wrapper">
        <div class="dashboard-card detail-card">

            <header class="card-header">
                <div class="header-left">
                    <a href="./tcr.html" class="btn-nav">← Back</a>
                </div>

                <div class="detail-header-actions">
                    <button type="button" class="theme-toggle" data-theme-toggle>Theme: Hana</button>
                    <button id="edit-habit-btn" class="btn-secondary">Edit</button>
                    <button id="delete-habit-btn" class="btn-danger">Delete</button>
                </div>
            </header>

            <div id="detail-loading" class="empty-state">Loading habit…</div>

            <div id="detail-error" class="form-error" hidden></div>

            <div id="detail-content" hidden>

                <div class="detail-title-block">
                    <div class="detail-title-row">
                        <div class="color-dot color-dot-lg" id="detail-color-dot"></div>
                        <h1 class="detail-title" id="detail-name">Habit</h1>
                        <span class="priority-badge" id="detail-priority-badge">MEDIUM</span>
                    </div>
                    <p class="detail-description" id="detail-description"></p>

                    <div class="detail-meta">
                        <span>Created <time id="detail-created-date">—</time></span>
                    </div>
                </div>

                <div class="detail-stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Completed</div>
                        <div class="stat-value" id="stat-completed">0</div>
                    </div>
                    <div class="stat-card stat-card-failed">
                        <div class="stat-label">Failed</div>
                        <div class="stat-value" id="stat-failed">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Total Days</div>
                        <div class="stat-value" id="stat-total">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Completion</div>
                        <div class="stat-value" id="stat-rate">0%</div>
                    </div>
                </div>

                <div class="detail-section">
                    <h2 class="detail-section-title">Full history</h2>
                    <div class="heatmap-wrap">
                        <div class="heatmap-months" id="heatmap-months"></div>
                        <div class="heatmap-body">
                            <div class="heatmap-weekdays">
                                <span>Mon</span>
                                <span>Wed</span>
                                <span>Fri</span>
                            </div>
                            <div class="heatmap-grid" id="heatmap-grid"></div>
                        </div>
                        <div class="heatmap-legend">
                            <span>Less</span>
                            <span class="heatmap-cell level-0"></span>
                            <span class="heatmap-cell level-1"></span>
                            <span class="heatmap-cell level-2"></span>
                            <span class="heatmap-cell level-3"></span>
                            <span class="heatmap-cell level-4"></span>
                            <span>More</span>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <div id="edit-modal" class="modal-overlay" hidden>
        <div class="modal">
            <h2 class="modal-title">Edit Habit</h2>

            <form id="edit-form">
                <div class="form-group">
                    <label for="edit-name">Habit name</label>
                    <input type="text" id="edit-name" required maxlength="100" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="edit-description">Description</label>
                    <textarea id="edit-description" maxlength="1000" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label for="edit-priority">Priority</label>
                    <select id="edit-priority" required>
                        <option value="LOW">Low</option>
                        <option value="MEDIUM">Medium</option>
                        <option value="HIGH">High</option>
                        <option value="CRITICAL">Critical</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button" id="cancel-edit-btn" class="btn-secondary">Cancel</button>
                    <button type="submit" id="save-edit-btn" class="btn-primary">Save Changes</button>
                </div>
            </form>

            <p id="edit-form-error" class="form-error" hidden></p>
        </div>
    </div>

    <div id="delete-modal" class="modal-overlay" hidden>
        <div class="modal">
            <h2 class="modal-title">Delete habit?</h2>
            <p class="modal-text">
                This will permanently delete
                <strong id="delete-habit-name">this habit</strong>
                and all of its history. This action cannot be undone.
            </p>

            <div class="modal-actions">
                <button type="button" id="cancel-delete-btn" class="btn-secondary">Cancel</button>
                <button type="button" id="confirm-delete-btn" class="btn-danger">Delete</button>
            </div>

            <p id="delete-form-error" class="form-error" hidden></p>
        </div>
    </div>

    <script type="module" src="habit-detail.js"></script>
</body>

</html>
